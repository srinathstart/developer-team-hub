services:
  - type: web
    name: developer-team-hub-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    initialDeployHook: node scripts/initializeDatabase.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: developer-team-hub-db
          property: connectionString

databases:
  - name: developer-team-hub-db
    plan: free
    region: singapore
    databaseName: developer_team_hub
    user: developer_team_hub
    postgresMajorVersion: "16"
